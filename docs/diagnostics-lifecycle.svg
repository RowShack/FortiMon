<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" font-family="inherit" role="img" aria-labelledby="dlc-title dlc-desc">
  <title id="dlc-title">The life of one issue</title>
  <desc id="dlc-desc">A condition that is seen starts in Watching. If it is seen for N polls in a row it becomes Active; if it disappears first it is dropped as a transient blip. An active issue resolves after it has been clear for 3 polls in a row. Admins can acknowledge an active issue, which keeps it out of the score until it resolves, or mute it, which keeps it out of the score until it is unmuted, even after it resolves and comes back. An acknowledged issue that gets worse than when it was acknowledged counts again. A resolved issue that happens again starts over at Watching.</desc>
  <defs>
    <marker id="dlc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted, #8b949e)"/>
    </marker>
  </defs>

  <!-- start -->
  <circle cx="40" cy="122" r="7" fill="var(--text, #e6edf3)"/>

  <!-- states -->
  <g fill="var(--panel, #161b22)" stroke-width="1.5">
    <rect x="90" y="90" width="160" height="64" rx="8" stroke="var(--muted, #8b949e)" stroke-dasharray="5 4"/>
    <rect x="400" y="90" width="170" height="64" rx="8" stroke="var(--accent, #1f6feb)" stroke-width="2"/>
    <rect x="700" y="90" width="170" height="64" rx="8" stroke="var(--good, #3fb950)"/>
    <rect x="90" y="250" width="160" height="60" rx="8" stroke="var(--line, #30363d)" stroke-dasharray="5 4"/>
    <rect x="330" y="250" width="180" height="80" rx="8" stroke="var(--info, #58a6ff)"/>
    <rect x="540" y="250" width="180" height="80" rx="8" stroke="var(--info, #58a6ff)"/>
  </g>
  <g fill="var(--text, #e6edf3)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="170" y="117">Watching</text>
    <text x="485" y="117">Active</text>
    <text x="785" y="117">Resolved</text>
    <text x="170" y="275" fill="var(--muted, #8b949e)">Transient blip</text>
    <text x="420" y="275">Acknowledged</text>
    <text x="630" y="275">Muted</text>
  </g>
  <g fill="var(--muted, #8b949e)" font-size="12" text-anchor="middle">
    <text x="170" y="138">counting 1 &#8230; N polls</text>
    <text x="485" y="138">counted in the score</text>
    <text x="785" y="138">logged with duration</text>
    <text x="170" y="296">dropped and counted</text>
    <text x="420" y="296">out of the score</text>
    <text x="420" y="314">gets worse: counts again</text>
    <text x="630" y="296">out of the score</text>
    <text x="630" y="314">recurs: still muted</text>
  </g>

  <!-- transitions -->
  <g stroke="var(--muted, #8b949e)" stroke-width="1.5" fill="none" marker-end="url(#dlc-ah)">
    <line x1="47" y1="122" x2="88" y2="122"/>
    <line x1="250" y1="122" x2="398" y2="122"/>
    <line x1="570" y1="122" x2="698" y2="122"/>
    <line x1="170" y1="154" x2="170" y2="248"/>
    <line x1="460" y1="154" x2="432" y2="248"/>
    <line x1="515" y1="154" x2="600" y2="248"/>
    <path d="M420,330 V372 H850 V156"/>
    <path d="M720,290 H760 V156"/>
    <path d="M785,90 V50 H170 V88" stroke-dasharray="5 4"/>
  </g>
  <g fill="var(--muted, #8b949e)" font-size="12">
    <text x="67" y="113" text-anchor="middle">seen</text>
    <text x="324" y="113" text-anchor="middle">N polls in a row</text>
    <text x="324" y="140" text-anchor="middle">event: raised</text>
    <text x="634" y="113" text-anchor="middle">clear for 3 polls</text>
    <text x="634" y="140" text-anchor="middle">event: resolved</text>
    <text x="178" y="206">gone before N</text>
    <text x="438" y="206" text-anchor="end">Acknowledge</text>
    <text x="566" y="200">Mute</text>
    <text x="635" y="365" text-anchor="middle">clears for 3 polls: the acknowledgement ends</text>
    <text x="768" y="226">clears:</text>
    <text x="768" y="242">mute kept</text>
    <text x="478" y="42" text-anchor="middle">happens again later: starts over at Watching (a mute still applies)</text>
  </g>
  <text x="450" y="412" text-anchor="middle" font-size="12" fill="var(--muted, #8b949e)">Severity is re-checked every poll while active. Removing an acknowledgement or unmuting puts it back in the score.</text>
</svg>
